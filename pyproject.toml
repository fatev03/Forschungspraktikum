[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "structure-audit"
version = "0.1.0"
description = "Offline bookkeeping and format/geometric plausibility checks for supplied structures"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
structure_audit = ["schemas/*.json"]
